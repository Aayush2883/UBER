<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 90" width="160" height="90">
  <defs>
    <linearGradient id="autoYellow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="autoGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="autoShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="80" cy="74" rx="55" ry="6" fill="#000000" opacity="0.16"/>

  <g filter="url(#autoShadow)">
    <!-- Yellow Canopy Roof -->
    <path d="M 38 42 C 40 28 54 22 76 22 C 104 22 124 24 130 36 C 132 40 130 52 130 52 L 40 52 Z" fill="url(#autoYellow)" stroke="#ca8a04" stroke-width="1"/>
    
    <!-- Windshield glass -->
    <path d="M 44 42 C 48 30 56 26 70 26 L 66 42 Z" fill="#38bdf8" opacity="0.6"/>
    <!-- Black canopy border -->
    <path d="M 36 43 L 132 43" stroke="#1e293b" stroke-width="2"/>

    <!-- Green Lower Body -->
    <path d="M 32 50 C 32 50 36 46 44 46 L 126 46 C 130 46 132 50 132 54 L 128 64 L 38 64 C 32 64 30 54 32 50 Z" fill="url(#autoGreen)" stroke="#14532d" stroke-width="1"/>

    <!-- Open Passenger Door / Cabin cutout -->
    <rect x="70" y="44" width="34" height="15" rx="2" fill="#1e293b" opacity="0.7"/>
    <rect x="74" y="52" width="26" height="5" rx="1" fill="#475569"/>

    <!-- Front Mudguard & Headlight -->
    <path d="M 30 52 C 26 54 26 58 32 60 Z" fill="#15803d"/>
    <circle cx="28" cy="54" r="3" fill="#fef08a" stroke="#eab308" stroke-width="0.5"/>

    <!-- Rear Taillight -->
    <rect x="129" y="53" width="3" height="5" rx="1" fill="#ef4444"/>
  </g>

  <!-- Front Single Wheel -->
  <g transform="translate(36, 64)">
    <circle cx="0" cy="0" r="10" fill="#1e293b"/>
    <circle cx="0" cy="0" r="5.5" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
    <circle cx="0" cy="0" r="2" fill="#0f172a"/>
  </g>

  <!-- Rear Wheel -->
  <g transform="translate(116, 64)">
    <circle cx="0" cy="0" r="11" fill="#1e293b"/>
    <circle cx="0" cy="0" r="6.5" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
    <circle cx="0" cy="0" r="2.5" fill="#0f172a"/>
  </g>
</svg>

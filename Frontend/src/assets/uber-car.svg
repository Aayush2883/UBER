<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 90" width="160" height="90">
  <defs>
    <linearGradient id="carGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f3f4f6"/>
      <stop offset="100%" stop-color="#d1d5db"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="carShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Drop Shadow on ground -->
  <ellipse cx="80" cy="74" rx="65" ry="7" fill="#000000" opacity="0.15" />
  
  <!-- Car Body -->
  <g filter="url(#carShadow)">
    <!-- Main Shell -->
    <path d="M 22 56 C 22 56 24 46 36 44 C 48 42 56 30 72 26 C 94 21 118 24 126 36 C 134 40 144 46 145 54 C 146 62 140 64 135 64 L 25 64 C 20 64 22 56 22 56 Z" fill="url(#carGrad)" stroke="#cbd5e1" stroke-width="1.5" stroke-linejoin="round"/>
    
    <!-- Windshield & Windows -->
    <path d="M 58 32 C 68 28 92 26 112 28 C 117 32 122 36 123 42 L 54 42 C 54 38 56 34 58 32 Z" fill="url(#glassGrad)"/>
    <path d="M 60 34 L 84 34 L 84 42 L 56 42 Z" fill="#38bdf8" opacity="0.35"/>
    <!-- Window divider -->
    <line x1="86" y1="28" x2="86" y2="42" stroke="#ffffff" stroke-width="1.5"/>

    <!-- Headlight -->
    <path d="M 22 52 C 22 48 26 48 28 52 C 26 56 22 56 22 52 Z" fill="#fef08a" stroke="#eab308" stroke-width="0.5"/>
    <!-- Taillight -->
    <path d="M 143 50 C 145 52 144 56 142 56 L 140 50 Z" fill="#ef4444"/>

    <!-- Door Line & Handle -->
    <path d="M 85 43 L 85 62" stroke="#94a3b8" stroke-width="1"/>
    <rect x="74" y="46" width="7" height="2" rx="1" fill="#64748b"/>
    <rect x="96" y="46" width="7" height="2" rx="1" fill="#64748b"/>
  </g>

  <!-- Wheels -->
  <!-- Front Wheel -->
  <g transform="translate(42, 64)">
    <circle cx="0" cy="0" r="11" fill="#1e293b"/>
    <circle cx="0" cy="0" r="6.5" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
    <circle cx="0" cy="0" r="2.5" fill="#0f172a"/>
  </g>
  <!-- Rear Wheel -->
  <g transform="translate(120, 64)">
    <circle cx="0" cy="0" r="11" fill="#1e293b"/>
    <circle cx="0" cy="0" r="6.5" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
    <circle cx="0" cy="0" r="2.5" fill="#0f172a"/>
  </g>
</svg>
